<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Finds</title>
<meta name="description" content="Every product from my TikTok videos. Search by code number or product name.">
<meta name="theme-color" content="#0A0A0C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230A0A0C'/%3E%3Cpath d='M20 26h24l-2 22H22z' fill='none' stroke='%2325F4EE' stroke-width='4' stroke-linejoin='round' transform='translate(-1.5 -1)'/%3E%3Cpath d='M20 26h24l-2 22H22z' fill='none' stroke='%23FE2C55' stroke-width='4' stroke-linejoin='round' transform='translate(1.5 1)'/%3E%3Cpath d='M26 26v-3a6 6 0 0 1 12 0v3' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --cyan: #25F4EE;
  --pink: #FE2C55;
  --pink-press: #E0244A;
  --head: #0A0A0C;
  --head-ink: #FFFFFF;
  --head-dim: rgba(255,255,255,.62);

  --bg: #F4F4F6;
  --card: #FFFFFF;
  --ink: #16161A;
  --ink-dim: #6E6E78;
  --line: rgba(0,0,0,.07);
  --chip: #FFFFFF;
  --chip-ink: #3A3A42;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 18px rgba(0,0,0,.06);

  --radius: 18px;
  --font: 'Plus Jakarta Sans', system-ui, sans-serif;
  --ease: cubic-bezier(.22,.61,.36,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg: #121216;
    --card: #1C1C22;
    --ink: #F2F2F5;
    --ink-dim: #9A9AA6;
    --line: rgba(255,255,255,.08);
    --chip: #1C1C22;
    --chip-ink: #D6D6DE;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.35);
  }
}

*{ margin:0; padding:0; box-sizing:border-box; }
body{
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
button, input{ font: inherit; color: inherit; }

/* ---------- Dark TikTok header ---------- */
.hero{
  background:
    radial-gradient(ellipse 60% 120% at 0% 0%, rgba(37,244,238,.16), transparent 60%),
    radial-gradient(ellipse 60% 120% at 100% 0%, rgba(254,44,85,.18), transparent 60%),
    var(--head);
  color: var(--head-ink);
  padding: 36px 16px 74px;
  text-align: center;
}
.eyebrow{
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--head-dim);
  border: 1px solid rgba(255,255,255,.14);
  padding: 6px 12px; border-radius: 999px;
}
.eyebrow .dot{ width:6px; height:6px; border-radius:50%; background: var(--pink); box-shadow: 0 0 8px var(--pink); }
h1{
  margin-top: 16px;
  font-size: clamp(32px, 8vw, 52px);
  font-weight: 800; letter-spacing: -.02em; line-height: 1.05;
  text-shadow: -2px -1px 0 var(--cyan), 2px 1px 0 var(--pink);
}
.hero p{
  margin: 12px auto 0; max-width: 420px;
  color: var(--head-dim); font-size: 15px; line-height: 1.5;
}

/* ---------- Sticky search ---------- */
.search-wrap{
  position: sticky; top: 0; z-index: 10;
  margin-top: -50px;
  padding: 12px 16px;
  transition: background .25s var(--ease), box-shadow .25s var(--ease);
}
.search-wrap.stuck{
  background: color-mix(in srgb, var(--head) 92%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 6px 20px rgba(0,0,0,.25);
}
.search{
  position: relative;
  max-width: 640px; margin: 0 auto;
}
.search input{
  width: 100%;
  height: 56px;
  padding: 0 52px 0 52px;
  border-radius: 999px;
  border: 2px solid transparent;
  background: var(--card);
  color: var(--ink);
  font-size: 16px; font-weight: 500;
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
  outline: none;
  transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
}
.search input::placeholder{ color: var(--ink-dim); font-weight: 400; }
.search input:focus{
  border-color: var(--pink);
  box-shadow: 0 0 0 4px rgba(254,44,85,.18), 0 10px 30px rgba(0,0,0,.25);
}
.search input::-webkit-search-cancel-button{ display:none; }
.search .icon{
  position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
  width: 20px; height: 20px; color: var(--ink-dim); pointer-events: none;
}
.clear{
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  width: 36px; height: 36px; border-radius: 50%;
  border: 0; background: var(--bg); color: var(--ink-dim);
  display: none; place-items: center; cursor: pointer;
}
.clear.show{ display: grid; }
.clear:hover{ color: var(--ink); }

/* ---------- Content ---------- */
main{ max-width: 1080px; margin: 0 auto; padding: 8px 16px 48px; }

.chips{
  display: flex; gap: 8px; overflow-x: auto;
  padding: 4px 0 12px; scrollbar-width: none;
  justify-content: flex-start;
}
.chips::-webkit-scrollbar{ display:none; }
@media (min-width: 640px){ .chips{ justify-content: center; flex-wrap: wrap; } }
.chip{
  flex: none;
  height: 36px; padding: 0 16px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--chip); color: var(--chip-ink);
  font-size: 14px; font-weight: 600; cursor: pointer;
  transition: background .2s var(--ease), color .2s var(--ease), border-color .2s var(--ease);
}
.chip:hover{ border-color: var(--ink-dim); }
.chip[aria-pressed="true"]{ background: var(--ink); color: var(--bg); border-color: var(--ink); }

.meta{
  font-size: 13px; color: var(--ink-dim); font-weight: 500;
  margin: 4px 2px 14px;
}

.grid{
  display: grid; gap: 12px;
  grid-template-columns: repeat(2, minmax(0,1fr));
}
@media (min-width: 640px){ .grid{ grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; } }
@media (min-width: 960px){ .grid{ grid-template-columns: repeat(4, minmax(0,1fr)); } }

.card{
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  display: flex; flex-direction: column;
  animation: pop .35s var(--ease) both;
}
@keyframes pop{ from{ opacity:0; transform: translateY(8px) scale(.98); } }

.thumb{
  position: relative; aspect-ratio: 1/1;
  background: var(--bg);
  overflow: hidden;
}
.thumb img{ width:100%; height:100%; object-fit: cover; display:block; }
.ph{
  width:100%; height:100%;
  display: grid; place-items: center;
  color: var(--ink-dim);
  background:
    radial-gradient(circle at 30% 25%, rgba(37,244,238,.28), transparent 55%),
    radial-gradient(circle at 75% 80%, rgba(254,44,85,.26), transparent 55%),
    var(--bg);
}
.ph svg{ width: 34%; height: 34%; opacity: .7; }
.code{
  position: absolute; top: 10px; left: 10px;
  background: var(--head); color: #fff;
  font-size: 13px; font-weight: 800; letter-spacing: .02em;
  padding: 5px 10px; border-radius: 999px;
  box-shadow: -1.5px -1px 0 var(--cyan), 1.5px 1px 0 var(--pink);
}

.body{ padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.tag{
  align-self: flex-start;
  font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  color: var(--ink-dim);
}
.name{
  font-size: 14.5px; font-weight: 600; line-height: 1.35;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  min-height: calc(1.35em * 2);
}
.buy{
  margin-top: auto;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  height: 42px; border-radius: 999px;
  background: var(--pink); color: #fff;
  font-size: 14px; font-weight: 700; text-decoration: none;
  transition: background .2s var(--ease), transform .1s var(--ease);
}
.buy:hover{ background: var(--pink-press); }
.buy:active{ transform: scale(.97); }
.buy svg{ width: 16px; height: 16px; }

.empty{
  display: none;
  text-align: center; padding: 48px 16px;
  color: var(--ink-dim);
}
.empty.show{ display: block; }
.empty .big{ width: 44px; height: 44px; }
.empty h2{ margin-top: 10px; font-size: 18px; color: var(--ink); }
.empty p{ margin-top: 6px; font-size: 14px; line-height: 1.5; }
.empty button{
  margin-top: 16px; height: 40px; padding: 0 18px; border-radius: 999px;
  border: 0; background: var(--ink); color: var(--bg); font-weight: 700; cursor: pointer;
}

footer{
  text-align: center; font-size: 12px; color: var(--ink-dim);
  padding: 0 16px 32px; line-height: 1.6;
}

@media (prefers-reduced-motion: reduce){ .card{ animation: none; } }
</style>
</head>
<body>

<header class="hero">
  <span class="eyebrow"><span class="dot"></span>Affiliate picks</span>
  <h1>TikTok Finds</h1>
  <p>Saw it in my video? Search the code number or the product name.</p>
</header>

<div class="search-wrap" id="searchWrap">
  <div class="search">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" inputmode="search" autocomplete="off" enterkeyhint="search"
           placeholder="Search code or product name" aria-label="Search products by code or name">
    <button class="clear" id="clear" type="button" aria-label="Clear search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
</div>

<main>
  <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
  <div class="meta" id="meta" aria-live="polite"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">
    <svg class="big" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <h2>No item found</h2>
    <p>Try the code number shown in the video,<br>or a shorter word from the product name.</p>
    <button type="button" id="reset">Show all items</button>
  </div>
</main>

<footer>As an affiliate, I may earn a small commission from purchases made through these links.</footer>

<script src="products.js"></script>
<script>
(function(){
  const PRODUCTS = (window.PRODUCTS || []).map(p => ({
    ...p,
    codeNum: parseInt(String(p.code).replace(/\D/g,''), 10),
    hay: norm([p.name, p.category, p.keywords].filter(Boolean).join(' ')).split(' ')
  }));
  const PH = '<div class="ph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg></div>';

  const $ = id => document.getElementById(id);
  const input = $('q'), grid = $('grid'), chips = $('chips'), meta = $('meta'),
        empty = $('empty'), clearBtn = $('clear');
  let activeCat = 'All';
  window.__PH = PH;

  function norm(s){
    return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[^a-z0-9]+/g,' ').trim();
  }
  const pad = n => isNaN(n) ? '' : String(n).padStart(3,'0');
  const esc = s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // Levenshtein distance capped at 2 (for typo tolerance)
  function near(a, b){
    if (Math.abs(a.length - b.length) > 1) return false;
    let prev = Array.from({length: b.length + 1}, (_, i) => i);
    for (let i = 1; i <= a.length; i++){
      const cur = [i];
      for (let j = 1; j <= b.length; j++){
        cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
      }
      prev = cur;
    }
    return prev[b.length] <= 1;
  }

  // Score one search word against a product; 0 = no match
  function scoreToken(p, t){
    if (/^\d+$/.test(t)){
      const n = parseInt(t, 10);
      if (p.codeNum === n) return 100;
      if (String(p.codeNum).startsWith(String(n)) || pad(p.codeNum).startsWith(t)) return 40;
    }
    let best = 0;
    for (const w of p.hay){
      if (w === t) return 12;
      if (w.startsWith(t)) best = Math.max(best, 8);
      else if (t.length >= 3 && w.includes(t)) best = Math.max(best, 5);
      else if (t.length >= 4 && near(t, w)) best = Math.max(best, 3);
    }
    return best;
  }

  function search(q){
    // "#12", "code 12", "kod 12", "no. 12" -> "12"
    const tokens = norm(q.replace(/#/g,' ')).split(' ')
      .filter(t => t && !['code','kod','no','number','nombor'].includes(t));
    let list = PRODUCTS.filter(p => activeCat === 'All' || p.category === activeCat);
    if (!tokens.length) return list.slice().sort((a,b) => b.codeNum - a.codeNum);
    return list
      .map(p => {
        let s = 0;
        for (const t of tokens){ const v = scoreToken(p, t); if (!v) return null; s += v; }
        return { p, s };
      })
      .filter(Boolean)
      .sort((a,b) => b.s - a.s || a.p.codeNum - b.p.codeNum)
      .map(x => x.p);
  }

  function card(p, i){
    const img = p.image
      ? `<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy" onerror="this.replaceWith(document.createRange().createContextualFragment(window.__PH))">`
      : PH;
    return `<article class="card" style="animation-delay:${Math.min(i,12)*30}ms">
      <div class="thumb">${img}<span class="code">#${pad(p.codeNum)}</span></div>
      <div class="body">
        ${p.category ? `<span class="tag">${esc(p.category)}</span>` : ''}
        <h3 class="name">${esc(p.name)}</h3>
        <a class="buy" href="${esc(p.link || '#')}" target="_blank" rel="noopener sponsored">
          Shop on TikTok
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
        </a>
      </div>
    </article>`;
  }

  function render(){
    const q = input.value;
    const results = search(q);
    grid.innerHTML = results.map(card).join('');
    empty.classList.toggle('show', results.length === 0);
    clearBtn.classList.toggle('show', q.length > 0);
    const n = results.length;
    meta.textContent = q.trim()
      ? `${n} result${n === 1 ? '' : 's'} for “${q.trim()}”`
      : `${n} item${n === 1 ? '' : 's'}${activeCat === 'All' ? '' : ' in ' + activeCat} · newest first`;
    meta.style.visibility = n ? 'visible' : 'hidden';
  }

  // Keep ?q= in the URL so a search can be shared, e.g. /shopping/tiktok/?q=12
  let urlTimer;
  function syncUrl(){
    clearTimeout(urlTimer);
    urlTimer = setTimeout(() => {
      const u = new URL(location.href);
      input.value.trim() ? u.searchParams.set('q', input.value.trim()) : u.searchParams.delete('q');
      history.replaceState(null, '', u);
    }, 400);
  }

  function buildChips(){
    const cats = [...new Set(PRODUCTS.map(p => p.category).filter(Boolean))];
    if (cats.length < 2){ chips.style.display = 'none'; return; }
    chips.innerHTML = ['All', ...cats].map(c =>
      `<button class="chip" type="button" aria-pressed="${c === activeCat}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
    chips.addEventListener('click', e => {
      const b = e.target.closest('.chip'); if (!b) return;
      activeCat = b.dataset.cat;
      chips.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b));
      render();
    });
  }

  input.addEventListener('input', () => { render(); syncUrl(); });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); });
  clearBtn.addEventListener('click', () => { input.value = ''; render(); syncUrl(); input.focus(); });
  $('reset').addEventListener('click', () => {
    input.value = ''; activeCat = 'All';
    chips.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x.dataset.cat === 'All'));
    render(); syncUrl();
  });

  // Darken the search bar background once it sticks to the top
  const wrap = $('searchWrap');
  new IntersectionObserver(([e]) => wrap.classList.toggle('stuck', e.intersectionRatio < 1),
    { threshold: [1], rootMargin: '-1px 0px 0px 0px' }).observe(wrap);

  const params = new URLSearchParams(location.search);
  input.value = params.get('q') || params.get('code') || '';
  buildChips();
  render();
})();
</script>
</body>
</html>
